server {
  listen 80;
  server_name localhost;

  # Locația fișierelor statice
  root /usr/share/nginx/html;
  index index.html;

  # Tratarea erorilor standard
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }

  # Locație specială pentru provocările Let's Encrypt
  location /.well-known/acme-challenge/ {
    root /usr/share/nginx/html;
    try_files $uri =404;
  }

  # Configurare pentru a suporta React Router
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy pentru API-ul de backend
  # Aceasta ne permite să apelăm /api/endpoint din frontend,
  # iar Nginx va redirecționa cererea către containerul backend.
  # Evităm astfel problemele de CORS în producție.
  location /api {
    proxy_pass http://webpanel-backend:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
